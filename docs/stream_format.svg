<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660" font-family="Segoe UI, Arial, sans-serif" font-size="15">
  <title>Our file format: the 49-byte header, the per-file key from HKDF, the chunks on the wire, and each chunk's nonce</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#33415c"/>
    </marker>
  </defs>
  <rect width="1120" height="660" fill="#ffffff"/>
  <text x="40" y="32" font-size="19" font-weight="700" fill="#14213a">Our file format and keys (format v1)</text>

  <!-- 1. Header -->
  <text x="40" y="62" font-size="14" font-weight="700" fill="#0f7563">1. Header: 49 bytes at the start of every file, readable (nothing in it is secret)</text>
  <g stroke="#33415c" stroke-width="1.5">
    <rect x="40" y="72" width="130" height="50" fill="#eef2f6"/>
    <rect x="170" y="72" width="110" height="50" fill="#eef2f6"/>
    <rect x="280" y="72" width="110" height="50" fill="#eef2f6"/>
    <rect x="390" y="72" width="150" height="50" fill="#eef2f6"/>
    <rect x="540" y="72" width="380" height="50" fill="#e6f3ef"/>
    <rect x="920" y="72" width="160" height="50" fill="#e6f3ef"/>
  </g>
  <g text-anchor="middle" fill="#14213a">
    <text x="105" y="93">magic "CHNK"</text><text x="105" y="113" font-size="13">4 B</text>
    <text x="225" y="93">version</text><text x="225" y="113" font-size="13">1 B</text>
    <text x="335" y="93">algorithm ID</text><text x="335" y="113" font-size="13">1 B</text>
    <text x="465" y="93">chunk size</text><text x="465" y="113" font-size="13">4 B</text>
    <text x="730" y="93">salt (fresh random per file)</text><text x="730" y="113" font-size="13">32 B</text>
    <text x="1000" y="93">nonce prefix (random)</text><text x="1000" y="113" font-size="13">7 B</text>
  </g>

  <!-- 2. Per-file key -->
  <text x="40" y="172" font-size="14" font-weight="700" fill="#0f7563">2. A key just for this file</text>
  <rect x="40" y="200" width="240" height="50" rx="6" fill="#f3f5f7" stroke="#33415c" stroke-width="1.5"/>
  <text x="160" y="221" text-anchor="middle" font-weight="600" fill="#14213a">Master key (secret)</text>
  <text x="160" y="240" text-anchor="middle" font-size="13" fill="#45525f">32 random bytes, never stored</text>
  <rect x="440" y="185" width="280" height="80" rx="6" fill="#d9e4f2" stroke="#33415c" stroke-width="1.5"/>
  <text x="580" y="209" text-anchor="middle" font-weight="700" fill="#14213a">HKDF-SHA256</text>
  <text x="580" y="230" text-anchor="middle" font-size="13" fill="#14213a">salt = the header's salt</text>
  <text x="580" y="250" text-anchor="middle" font-size="13" fill="#14213a">info = all 49 header bytes</text>
  <rect x="880" y="200" width="200" height="50" rx="6" fill="#0f7563" stroke="#0f7563"/>
  <text x="980" y="221" text-anchor="middle" font-weight="700" fill="#ffffff">Stream key K</text>
  <text x="980" y="240" text-anchor="middle" font-size="13" fill="#ffffff">unique to this file</text>
  <g stroke="#33415c" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M280 225H438"/><path d="M720 225H878"/>
  </g>
  <g stroke="#0f7563" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#a)">
    <path d="M730 122L650 183"/><path d="M330 122L500 183"/>
  </g>
  <text x="700" y="152" font-size="13" fill="#0f7563">salt</text>
  <text x="240" y="160" font-size="13" fill="#0f7563">whole header</text>

  <!-- 3. Wire -->
  <text x="40" y="300" font-size="14" font-weight="700" fill="#0f7563">3. The encrypted file</text>
  <g stroke="#33415c" stroke-width="1.5">
    <rect x="40" y="312" width="150" height="56" fill="#eef2f6"/>
    <rect x="210" y="312" width="240" height="56" fill="#ffffff"/>
    <rect x="470" y="312" width="240" height="56" fill="#ffffff"/>
    <rect x="730" y="312" width="80" height="56" fill="#ffffff"/>
    <rect x="830" y="312" width="240" height="56" fill="#e6f3ef" stroke="#0f7563" stroke-width="2"/>
  </g>
  <g text-anchor="middle" fill="#14213a">
    <text x="115" y="336" font-weight="600">Header</text><text x="115" y="356" font-size="13">49 B</text>
    <text x="330" y="336" font-weight="600">Chunk 0</text><text x="330" y="356" font-size="13">1 MiB ciphertext + 16 B tag</text>
    <text x="590" y="336" font-weight="600">Chunk 1</text><text x="590" y="356" font-size="13">1 MiB ciphertext + 16 B tag</text>
    <text x="770" y="346">…</text>
    <text x="950" y="336" font-weight="600">Last chunk</text><text x="950" y="356" font-size="13">≤ 1 MiB + 16 B tag</text>
  </g>
  <g stroke="#33415c" stroke-width="1.5" fill="none">
    <path d="M980 250V285H330"/>
  </g>
  <g stroke="#33415c" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M330 285V310"/><path d="M590 285V310"/><path d="M950 285V310"/>
  </g>
  <text x="990" y="272" font-size="13" fill="#45525f">seals every chunk</text>

  <!-- 4. Nonce -->
  <text x="40" y="410" font-size="14" font-weight="700" fill="#0f7563">4. Each chunk's nonce: 12 bytes, never sent (the receiver rebuilds it from the chunk's position)</text>
  <g stroke="#33415c" stroke-width="1.5">
    <rect x="40" y="422" width="520" height="50" fill="#eef2f6"/>
    <rect x="560" y="422" width="320" height="50" fill="#d9e4f2"/>
    <rect x="880" y="422" width="200" height="50" fill="#fbede5"/>
  </g>
  <g text-anchor="middle" fill="#14213a">
    <text x="300" y="443">prefix (from the header)</text><text x="300" y="463" font-size="13">7 B</text>
    <text x="720" y="443">chunk counter i</text><text x="720" y="463" font-size="13">4 B</text>
    <text x="980" y="443">final flag</text><text x="980" y="463" font-size="13">1 B</text>
  </g>
  <g font-size="14" fill="#14213a">
    <text x="60" y="502">chunk 0:   prefix ‖ 00 00 00 00 ‖ 00</text>
    <text x="60" y="526">chunk 1:   prefix ‖ 00 00 00 01 ‖ 00</text>
    <text x="60" y="550">last chunk (number n−1):   prefix ‖ n−1 ‖ 01</text>
  </g>
  <text x="620" y="502" font-size="13" fill="#45525f">chunk i = AES-256-GCM(K, nonce_i, plaintext_i)</text>
  <text x="620" y="526" font-size="13" fill="#45525f">→ ciphertext_i ‖ 16-byte tag_i</text>

  <g font-size="13" fill="#45525f">
    <text x="40" y="594">Why each part:  counter → reordering and replay fail.   final flag → truncation and appending fail.</text>
    <text x="40" y="616">per-file key (salt + HKDF) → chunks can't be moved between files, and nonces can't repeat across files.</text>
    <text x="40" y="638">whole header as HKDF info → editing any header byte changes the key, so every chunk fails.</text>
  </g>
</svg>
